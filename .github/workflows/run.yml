name: 刷步数

on:
  schedule:
    # UTC，分别对应北京时间 12:23、16:23、22:23。
    # 独立表达式便于在日志中识别计划时段；修改 cron 重新激活调度。
    - cron: '23 4 * * *'
    - cron: '23 8 * * *'
    - cron: '23 14 * * *'
    # 临时验证：2026-11-17 北京时间 10:20，验证后移除。
    - cron: '20 2 17 11 *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 记录触发信息
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: |
          {
            printf 'Event: %s\n' "$TRIGGER_EVENT"
            printf 'Cron (UTC): %s\n' "$TRIGGER_SCHEDULE"
            TZ=Asia/Shanghai date '+Started (Beijing): %Y-%m-%d %H:%M:%S'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Checkout codes
        uses: actions/checkout@v5
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 -u main.py
      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          if [ ! -f encrypted_tokens.data ]; then
            echo "No token cache file to persist"
            exit 0
          fi
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist"
          else
            git commit -m 'persist tokens trigger by ${{ github.event_name }}'
            git push origin master
          fi