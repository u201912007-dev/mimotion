name: 刷步数

on:
  schedule:
    # GitHub Actions 使用 UTC；对应北京时间 08:07、10:07、12:07、14:07、16:07、22:07
    - cron: '7 0,2,4,6,8,14 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
      - name: Update system and install zsh
        run: |
          sudo -E apt-get -qq update
          sudo -E apt-get install zsh -y
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 main.py
      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist"
          else
            git commit -m 'persist tokens trigger by ${{ github.event_name }}'
            git push origin master
          fi