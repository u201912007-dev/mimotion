name: 刷步数

on:
  schedule:
    # 北京时间每天三次；依据历史运行记录缩减计划，减少计算资源使用
    - cron: '23 12,16,22 * * *'
      timezone: 'Asia/Shanghai'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimotion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout codes
        uses: actions/checkout@v5
      - name: 初始化Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: 开始
        env:
            CONFIG: ${{ secrets.CONFIG }}
            AES_KEY: ${{ secrets.AES_KEY }}
        run: |
          pip3 install requests pytz pycryptodome
          python3 -u main.py
      - name: persist tokens
        run: |
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          if [ ! -f encrypted_tokens.data ]; then
            echo "No token cache file to persist"
            exit 0
          fi
          git add encrypted_tokens.data
          if git diff --cached --quiet; then
            echo "No token changes to persist"
          else
            git commit -m 'persist tokens trigger by ${{ github.event_name }}'
            git push origin master
          fi